<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日吃甚麼 — 命運大輪盤</title>
<meta name="description" content="吃飯時間不用想，按一下，輪盤幫你挑一間附近的餐廳。">
<meta name="theme-color" content="#FFF8EC">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EC; --card:#FFFFFF; --ink:#2B2118;
    --tomato:#FF6B4A; --tomato-deep:#E85436; --mustard:#FFC94D;
    --teal:#2FB6A5; --teal-deep:#22988A; --plum:#8A5A8C;
    --muted:#8C7D6C; --line:#F0E4D0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    font-family:'Noto Sans TC',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 18%, rgba(255,201,77,0.35), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(47,182,165,0.25), transparent 42%),
      radial-gradient(circle at 82% 88%, rgba(255,107,74,0.22), transparent 45%),
      var(--cream);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .app-shell{
    width:100%; max-width:460px;
    background:radial-gradient(circle at calc(100% - 20px) 20px, rgba(255,201,77,0.25) 0 80px, transparent 81px), var(--card); /* 右上角的裝飾圓 */
    border-radius:28px;
    box-shadow:0 30px 70px -30px rgba(43,33,24,0.35);
    padding:36px 24px 24px;
    position:relative; overflow:hidden;
  }
  .step{display:none; position:relative;}
  .step.active{display:block; animation:fade-up 0.35s ease;}
  @keyframes fade-up{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

  h1{
    font-family:'ZCOOL KuaiLe',sans-serif; font-weight:400;
    font-size:32px; text-align:center; color:var(--tomato-deep); margin-bottom:6px;
  }
  .subtitle{text-align:center; color:var(--muted); font-size:14px; margin-bottom:24px;}
  .icon-row{text-align:center; font-size:48px; margin-bottom:24px;}

  .btn{
    display:block; width:100%; border:none; border-radius:100px;
    padding:16px; font-family:inherit; font-size:16px; font-weight:700;
    cursor:pointer; text-align:center; text-decoration:none;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn + .btn{margin-top:12px;}
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible, .chip:focus-visible, .link:focus-visible{outline:2px solid var(--plum); outline-offset:3px;}
  .btn-primary{background:var(--tomato); color:#fff; box-shadow:0 10px 24px -8px rgba(255,107,74,0.6);}
  .btn-primary:hover{background:var(--tomato-deep);}
  .btn-go{background:var(--teal); color:#fff; box-shadow:0 10px 24px -8px rgba(47,182,165,0.55);}
  .btn-go:hover{background:var(--teal-deep);}
  .btn-secondary{background:var(--line); color:var(--ink);}
  .btn-secondary:hover{background:#E7D8BE;}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}

  .link{
    background:none; border:none; font-family:inherit; font-size:13px;
    color:var(--plum); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  .link-row{display:flex; justify-content:center; gap:20px; margin-top:20px; flex-wrap:wrap;}

  .hint{text-align:center; font-size:12.5px; color:var(--muted); line-height:1.6;}
  .error-box{
    background:#FDEDEA; color:#B03A22; border-radius:14px;
    padding:14px 16px; font-size:13.5px; line-height:1.6; margin-bottom:16px; display:none;
  }
  .error-box.show{display:block;}

  .prefs{border-top:1px solid var(--line); margin-top:24px; padding-top:20px;}
  .walk-value{text-align:center; margin:4px 0 10px;}
  .walk-value b{font-family:'ZCOOL KuaiLe',sans-serif; font-weight:400; font-size:24px; color:var(--tomato-deep);}
  .walk-value span{font-size:12.5px; color:var(--muted); margin-left:6px;}
  .walk-slider{
    -webkit-appearance:none; appearance:none; display:block; width:100%; height:32px; margin:0;
    background:transparent; cursor:pointer; touch-action:pan-y;
  }
  .walk-slider::-webkit-slider-runnable-track{
    height:10px; border-radius:10px;
    background:linear-gradient(to right, var(--tomato) var(--fill,30%), var(--line) var(--fill,30%));
  }
  .walk-slider::-moz-range-track{height:10px; border-radius:10px; background:var(--line);}
  .walk-slider::-moz-range-progress{height:10px; border-radius:10px; background:var(--tomato);}
  .walk-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:28px; height:28px; margin-top:-9px; border-radius:50%;
    background:#fff; border:4px solid var(--tomato); box-shadow:0 3px 8px rgba(43,33,24,0.25);
  }
  .walk-slider::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%;
    background:#fff; border:4px solid var(--tomato); box-shadow:0 3px 8px rgba(43,33,24,0.25);
  }
  .walk-slider:focus-visible{outline:2px solid var(--plum); outline-offset:4px; border-radius:10px;}
  /* 圖示對齊拉桿上的 1、7、13、20 分鐘；左右各留半個拉桿圓鈕的寬度 */
  .walk-icons{position:relative; height:74px; margin:6px 14px 14px;}
  .walk-icon{
    position:absolute; top:0; width:56px; margin-left:-28px; padding:0;
    background:none; border:none; cursor:pointer; font-family:inherit; text-align:center;
    color:var(--muted); opacity:0.45; transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .walk-icon svg{display:block; width:44px; height:52px; margin:0 auto;}
  .walk-icon small{display:block; font-size:11px; margin-top:2px; white-space:nowrap;}
  .walk-icon[aria-pressed="true"]{opacity:1; color:var(--tomato-deep); transform:scale(1.18);}
  .walk-icon[aria-pressed="true"] small{font-weight:700;}
  .walk-icon[aria-pressed="true"] svg{animation:walk-bob 0.9s ease-in-out infinite;}
  .walk-icon[data-kind="dance"][aria-pressed="true"] svg{animation:walk-dance 0.6s ease-in-out infinite;}
  .walk-icon[data-kind="tired"][aria-pressed="true"] svg, .walk-icon[data-kind="cane"][aria-pressed="true"] svg{animation-duration:1.8s;}
  @keyframes walk-bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);}}
  @keyframes walk-dance{0%,100%{transform:rotate(-9deg);} 50%{transform:rotate(9deg);}}
  .pref-label{font-size:13px; font-weight:700; margin-bottom:8px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    padding:8px 14px; border-radius:100px; font-size:13px; font-weight:500;
    cursor:pointer; font-family:inherit;
  }
  .chip[aria-pressed="true"]{background:var(--tomato); border-color:var(--tomato); color:#fff; font-weight:700;}

  .spinner{
    width:56px; height:56px; border-radius:50%;
    border:5px solid var(--line); border-top-color:var(--tomato);
    margin:32px auto 24px; animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{text-align:center; font-size:15px; font-weight:500;}
  .loading-sub{text-align:center; font-size:12.5px; color:var(--muted); margin:6px 0 24px; min-height:18px;}

  .topbar{display:flex; justify-content:space-between; align-items:center; min-height:24px; margin:-16px 0 12px; position:relative; z-index:1;}
  .where{text-align:center; font-size:13px; margin-top:14px; line-height:1.8;}
  .where b{font-weight:700;}
  .info-box{background:#FFF3D6; color:#6B4E00; border-radius:14px; padding:14px 16px; font-size:13.5px; line-height:1.7; margin-bottom:16px;}
  .area-chips{max-height:260px; overflow-y:auto; padding:2px; margin-bottom:8px;}
  .divider{text-align:center; font-size:12.5px; color:var(--muted); margin:18px 0 14px;}
  .wheel-note{text-align:center; font-size:13.5px; margin-bottom:20px; line-height:1.6;}
  .wheel-stage{position:relative; width:280px; height:280px; margin:0 auto 28px;}
  .pointer{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent;
    border-top:24px solid var(--plum);
    z-index:3; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  .wheel-dial{
    width:280px; height:280px; border-radius:50%;
    box-shadow:0 0 0 8px #fff, 0 0 0 10px var(--line), 0 20px 40px -15px rgba(43,33,24,0.4);
  }
  .wheel-dial canvas{display:block; width:280px; height:280px; border-radius:50%;}
  .wheel-hub{
    position:absolute; top:50%; left:50%; width:52px; height:52px;
    transform:translate(-50%,-50%); background:#fff; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2); z-index:2;
  }

  .result-label{text-align:center; font-size:13px; color:var(--muted); margin-bottom:4px;}
  .result-name{
    text-align:center; font-family:'ZCOOL KuaiLe',sans-serif;
    font-size:30px; line-height:1.3; color:var(--tomato-deep);
    margin-bottom:8px; overflow-wrap:anywhere;
  }
  .result-meta{text-align:center; font-size:14px; margin-bottom:12px;}
  .result-status{text-align:center; font-size:13px; margin-bottom:4px;}
  .result-detail{text-align:center; font-size:12.5px; color:var(--muted); line-height:1.6; overflow-wrap:anywhere;}
  .result-map{
    width:100%; height:150px; border-radius:14px; overflow:hidden;
    margin:16px 0; border:1px solid var(--line);
  }
  .result-map iframe{width:100%; height:100%; border:0;}
  .toast{text-align:center; font-size:12.5px; color:var(--teal-deep); min-height:20px; margin:10px 0 2px;}

  .section-title{text-align:center; font-size:16px; font-weight:700; margin-bottom:6px;}
  .history-item{
    border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .history-item .h-name{font-weight:700; font-size:15px; overflow-wrap:anywhere;}
  .history-item .h-time{font-size:12px; color:var(--muted); margin-top:2px;}
  .history-item a{font-size:13px; color:var(--plum); white-space:nowrap;}
  .history-empty{text-align:center; font-size:13.5px; color:var(--muted); padding:28px 0;}

  .footer{
    text-align:center; font-size:11px; color:var(--muted);
    margin-top:24px; padding-top:14px; border-top:1px solid var(--line); line-height:1.6;
  }
  .footer a{color:inherit;}

  @media (prefers-reduced-motion: reduce){
    .spinner, .step.active, .walk-icon svg{animation:none !important;}
  }
</style>
</head>
<body>

<main class="app-shell">

  <div class="topbar">
    <button class="link" id="btn-home" hidden data-i18n="home"></button>
    <span></span>
    <button class="link" id="btn-lang"></button>
  </div>

  <!-- 首頁 -->
  <section class="step active" id="step-start">
    <h1 data-i18n="title"></h1>
    <p class="subtitle" data-i18n="subtitle"></p>
    <div class="icon-row" aria-hidden="true">🍜🎡🥡</div>
    <div class="error-box" id="error-box" role="alert"></div>
    <button class="btn btn-primary" id="btn-go" data-i18n="go"></button>
    <div class="where"><span id="where-label"></span>　<button class="link" id="btn-change-loc" data-i18n="changePlace"></button></div>

    <div class="prefs">
      <div class="pref-label" data-i18n="distLabel"></div>
      <div class="walk-value"><b id="walk-min"></b><span id="walk-dist"></span></div>
      <input class="walk-slider" id="walk-slider" type="range" min="1" max="20" step="1">
      <div class="walk-icons" id="walk-icons"></div>
      <div class="chips" style="margin-bottom:0;">
        <button class="chip" id="chip-veg" aria-pressed="false" data-i18n="vegOnly"></button>
      </div>
    </div>
    <p class="hint" style="margin-top:16px;" data-i18n="prefHint"></p>

    <div class="link-row">
      <button class="link" id="btn-history-start" data-i18n="history"></button>
    </div>
  </section>

  <!-- 載入 -->
  <section class="step" id="step-loading" aria-live="polite">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text"></div>
    <div class="loading-sub" id="loading-sub"></div>
    <button class="btn btn-secondary" id="btn-cancel" data-i18n="cancel"></button>
  </section>

  <!-- 選地點 -->
  <section class="step" id="step-place">
    <div class="section-title" data-i18n="placeTitle"></div>
    <div class="info-box" id="place-msg" hidden></div>
    <button class="btn btn-primary" id="btn-use-gps" data-i18n="useGps"></button>
    <div class="divider" data-i18n="orPick"></div>
    <div class="chips" id="region-chips"></div>
    <div class="chips area-chips" id="area-chips"></div>
    <p class="hint" data-i18n="placeHint"></p>
  </section>

  <!-- 輪盤 -->
  <section class="step" id="step-wheel">
    <div class="wheel-note" id="wheel-note"></div>
    <div class="wheel-stage">
      <div class="pointer"></div>
      <div class="wheel-dial" id="wheel-dial"><canvas id="wheel-canvas"></canvas></div>
      <div class="wheel-hub" aria-hidden="true">🍴</div>
    </div>
    <button class="btn btn-primary" id="btn-spin" data-i18n="spin"></button>
  </section>

  <!-- 結果 -->
  <section class="step" id="step-result">
    <div class="result-label" data-i18n="resultLabel"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-meta" id="result-meta"></div>
    <div class="result-status" id="result-status"></div>
    <div class="result-detail" id="result-detail"></div>
    <div class="result-map" id="result-map"></div>

    <a class="btn btn-go" id="btn-navigate" target="_blank" rel="noopener" data-i18n="takeMe"></a>
    <button class="btn btn-primary" id="btn-reject" data-i18n="reject"></button>
    <a class="btn btn-secondary" id="btn-phone"></a>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="link-row" style="margin-top:8px;">
      <a class="link" id="link-reviews" target="_blank" rel="noopener" data-i18n="reviews"></a>
      <button class="link" id="btn-history-result" data-i18n="history"></button>
    </div>
  </section>

  <!-- 紀錄 -->
  <section class="step" id="step-history">
    <div class="section-title" data-i18n="history"></div>
    <p class="hint" style="margin-bottom:18px;" id="history-hint"></p>
    <div id="history-list"></div>
    <button class="btn btn-primary" id="btn-history-back" data-i18n="backToResult" hidden></button>
    <button class="btn btn-secondary" id="btn-history-clear" data-i18n="clearHistory"></button>
  </section>

  <div class="footer">
    <span data-i18n="footData"></span> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a><br>
    <span data-i18n="footPrivacy"></span>
  </div>
</main>

<script>
/* ============ 設定 ============ */

const OVERPASS_ENDPOINTS = [

/* PURE-START —— 以下是純函式，不碰 DOM */
const DAY_KEYS = ['su','mo','tu','we','th','fr','sa'];

function parseDays(part){
  const set = new Set();
  if(!part){ for(let i=0;i<7;i++) set.add(i); return set; }
  for(const tok of part.split(',')){
    const t = tok.trim();
    if(!t) continue;
    if(t === 'ph' || t === 'sh') continue; // 國定假日／學校假期的規則略過
    const m = t.match(/^(mo|tu|we|th|fr|sa|su)(?:\s*-\s*(mo|tu|we|th|fr|sa|su))?$/);
    if(!m) return null;
    const a = DAY_KEYS.indexOf(m[1]);
    const b = m[2] ? DAY_KEYS.indexOf(m[2]) : a;
    for(let d=a;; d=(d+1)%7){ set.add(d); if(d===b) break; }
  }
  return set;
}

function parseTimes(part){
  if(part === 'off' || part === 'closed') return [];
  if(part === '24/7') return [[0,1440]];
  const out = [];
  for(const tok of part.split(',')){
    const m = tok.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    const a = +m[1]*60 + +m[2];
    let b = +m[3]*60 + +m[4];
    if(b <= a) b += 1440; // 跨夜
    out.push([a,b]);
  }
  return out;
}

// 解讀 OSM opening_hours 的常見寫法。回傳 true／false；看不懂或沒有資料則回傳 null。
function isOpenAt(str, now){
  if(!str) return null;
  const s = String(str).trim().toLowerCase();
  if(s === '24/7') return true;
  const today = now.getDay(), yday = (today+6)%7;
  const mins = now.getHours()*60 + now.getMinutes();
  let todayRanges = null, ydayRanges = null, any = false;
  for(const raw of s.split(';')){
    const rule = raw.trim();
    if(!rule) continue;
    const idx = rule.search(/\d|off|closed/);
    if(idx < 0) return null;
    const days  = parseDays(rule.slice(0,idx).replace(/[:\s,]+$/,'').trim());
    const times = parseTimes(rule.slice(idx).trim());
    if(!days || !times) return null;
    if(!days.size) continue;
    any = true;
    if(days.has(today)) todayRanges = times; // 後面的規則覆蓋前面的
    if(days.has(yday))  ydayRanges  = times;
  }
  if(!any) return null;
  if(todayRanges && todayRanges.some(([a,b]) => mins >= a && mins < b)) return true;
  if(ydayRanges  && ydayRanges.some(([a,b]) => b > 1440 && mins < b-1440)) return true;
  return false;
}

function haversineM(lat1,lng1,lat2,lng2){
  const R = 6371000, rad = x => x*Math.PI/180;
  const dLat = rad(lat2-lat1), dLng = rad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(a)));
}

function cuisineKeys(tags){
  const raw = (tags.cuisine || '').toLowerCase().split(/[;,]/).map(x => x.trim()).filter(Boolean);
  const keys = [...new Set(raw)].slice(0,2);
  if(keys.length) return keys;
  if(tags.amenity === 'fast_food' || tags.amenity === 'food_court') return [tags.amenity];
  return [];
}

function toPlace(el, loc, now){
  const tags = el.tags || {};
  const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
  const lng = el.lon != null ? el.lon : (el.center && el.center.lon);
  if(!tags.name || lat == null || lng == null) return null;
  const cuisineRaw = (tags.cuisine || '').toLowerCase();
  const yes = v => v === 'yes' || v === 'only';
  return {
    id: el.type + '/' + el.id,
    name: tags.name,
    nameEn: tags['name:en'] || '',
    lat, lng,
    distanceM: haversineM(loc.lat, loc.lng, lat, lng),
    cuisine: cuisineKeys(tags), // OSM 的原始分類，顯示時再依語言轉換
    veg: yes(tags['diet:vegetarian']) || yes(tags['diet:vegan']) || /vegetarian|vegan/.test(cuisineRaw),
    open: isOpenAt(tags.opening_hours, now),
    hours: tags.opening_hours || '',
    address: tags['addr:full'] || [tags['addr:street'], tags['addr:housenumber']].filter(Boolean).join(' '),
    phone: tags.phone || tags['contact:phone'] || ''
  };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ============ 語言 ============ */
function t(key, ...args){
  const v = I18N[lang][key];
  return typeof v === 'function' ? v(...args) : v;
}
// 1 分鐘算 100 公尺（定位本身就有幾十公尺誤差），之後每分鐘 75 公尺
function walkRadius(min){ return Math.max(100, min * WALK_M_PER_MIN); }
function fmtDist(m){ return m >= 1000 ? t('km', +(m/1000).toFixed(1)) : t('m', m); }
function placeName(p){ return (lang === 'en' && p.nameEn) ? p.nameEn : p.name; }
function areaName(a){ return lang === 'en' ? a.en : a.zh; }
function cuisineText(p){
  return (p.cuisine || []).map(k => {
    const plain = k.replace(/_/g, ' ');
    return lang === 'zh' ? (CUISINE_ZH[k] || plain) : plain.charAt(0).toUpperCase() + plain.slice(1);
  }).join(lang === 'zh' ? '・' : ', ');
}
function applyLang(){
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.title = t('docTitle');
  document.querySelector('meta[name="description"]').setAttribute('content', t('desc'));
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('btn-lang').textContent = '🌐 ' + I18N[lang === 'zh' ? 'en' : 'zh'].langName;
  $('history-hint').textContent = t('historyHint', AVOID_REPEAT_DAYS);
  renderPrefs();
}

/* ============ 畫面切換 ============ */
const STEPS = ['start','loading','place','wheel','result','history'];
function showStep(name){
  if(name !== 'loading') stopLoadingClock();
  STEPS.forEach(s => $('step-'+s).classList.toggle('active', s === name));
  $('btn-home').hidden = name === 'start';   // 首頁以外都有「首頁」
  $('btn-lang').hidden = name !== 'start';   // 語言只在首頁切換
  window.scrollTo(0,0);
}
function goHome(){
  cancelRun();
  spinToken++; spinning = false; $('btn-spin').disabled = false; // 轉到一半也可以離開
  renderPrefs();
  showStep('start');
}
$('btn-home').addEventListener('click', () => { clearError(); goHome(); });

function showError(msg){
  goHome();
  $('error-box').textContent = '⚠️ ' + msg;
  $('error-box').classList.add('show');
}
function clearError(){ $('error-box').classList.remove('show'); }
function setLoading(text, sub){
  $('loading-text').textContent = text;
  $('loading-sub').textContent = sub || '';
}
function stopLoadingClock(){ clearInterval(loadClock); loadClock = null; }
function startLoadingClock(){
  stopLoadingClock();
  const t0 = Date.now();
  loadClock = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    if(sec >= 12)     $('loading-sub').textContent = t('stillWaiting', sec, FETCH_TIMEOUT_MS/1000);
    else if(sec >= 5) $('loading-sub').textContent = t('slow');
  }, 1000);
}
function cancelRun(){
  run++;
  if(runCtrl) runCtrl.abort();
  stopLoadingClock();
}

/* ============ 偏好 ============ */
function walkKind(min){
  // 圖示之間取中點分段：1–4 跳舞、5–10 慢走、11–16 走到累、17–20 拄拐杖
  let kind = WALK_ICONS[0][1];
  WALK_ICONS.forEach(([m, k], i) => { if(i && min > (WALK_ICONS[i-1][0] + m) / 2) kind = k; });
  return kind;
}
function buildWalkIcons(){
  const wrap = $('walk-icons');
  wrap.textContent = '';
  WALK_ICONS.forEach(([min, kind]) => {
    const btn = document.createElement('button');
    btn.className = 'walk-icon';
    btn.dataset.kind = kind;
    btn.dataset.min = min;
    btn.style.left = ((min - 1) / (WALK_MIN_MAX - 1) * 100) + '%';
    btn.innerHTML = '<svg viewBox="0 0 48 52" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
                  + WALK_SVG[kind] + '</svg><small></small>'; // 內容是上面寫死的 SVG，不含外部資料
    wrap.appendChild(btn);
  });
}
function renderWalk(){
  const min = prefs.min, d = fmtDist(walkRadius(min));
  const slider = $('walk-slider');
  slider.value = min;
  slider.style.setProperty('--fill', ((min - 1) / (WALK_MIN_MAX - 1) * 100) + '%');
  slider.setAttribute('aria-label', t('distLabel'));
  slider.setAttribute('aria-valuetext', t('walkAria', min, d));
  $('walk-min').textContent = t('walkMin', min);
  $('walk-dist').textContent = t('walkDist', d);
  const kind = walkKind(min);
  document.querySelectorAll('.walk-icon').forEach(btn => {
    btn.setAttribute('aria-pressed', String(btn.dataset.kind === kind));
    btn.querySelector('small').textContent = t('minShort', btn.dataset.min);
  });
}
function renderPrefs(){
  renderWalk();
  $('chip-veg').setAttribute('aria-pressed', String(prefs.veg));
  $('where-label').textContent = manualPlace ? t('whereManual', areaName(manualPlace)) : t('whereGps');
}
function setWalk(min, save){
  prefs.min = Math.min(WALK_MIN_MAX, Math.max(1, Math.round(min)));
  if(save) store.set('todayeat_prefs', prefs);
  renderWalk();
}
$('walk-slider').addEventListener('input', e => setWalk(Number(e.target.value), false));  // 拉的時候即時更新
$('walk-slider').addEventListener('change', e => setWalk(Number(e.target.value), true));  // 放手才存
$('walk-icons').addEventListener('click', e => {
  const btn = e.target.closest('.walk-icon');
  if(btn) setWalk(Number(btn.dataset.min), true);
});
$('chip-veg').addEventListener('click', () => {
  prefs.veg = !prefs.veg;
  store.set('todayeat_prefs', prefs);
  renderPrefs();
});

/* ============ 定位 ============ */
function getCachedLoc(){
  const c = memLoc || store.get('todayeat_loc', null);
  if(c && Date.now() - c.ts < LOC_TTL_MS){ memLoc = c; return c; }
  memLoc = null;
  return null;
}
// 失敗時 reject 一個 I18N 的 key，讓選地點頁顯示對應說明
function locate(){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject('geoUnsupported');
    let settled = false;
    // 定位提示如果沒人回應，瀏覽器不會自己逾時，所以自己計時
    const dog = setTimeout(() => {
      if(settled) return;
      settled = true;
      reject('geoFailed');
    }, GEO_WATCHDOG_MS);
    navigator.geolocation.getCurrentPosition(
      pos => {
        if(settled) return;
        settled = true; clearTimeout(dog);
        const c = {lat:pos.coords.latitude, lng:pos.coords.longitude, ts:Date.now()};
        memLoc = c;
        store.set('todayeat_loc', c);
        resolve(c);
      },
      err => {
        if(settled) return;
        settled = true; clearTimeout(dog);
        const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
        reject(err.code === 1 ? (ios ? 'geoDeniedIos' : 'geoDenied') : 'geoFailed');
      },
      {timeout:10000, maximumAge:60000}
    );
  });
}

/* ============ 手動選地點 ============ */
function defaultRegion(){
  let tz = '';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  if(/Macau/i.test(tz)) return 'mo';
  if(/Taipei/i.test(tz)) return 'tw';
  return 'hk';
}
function renderPlacePicker(){
  if(!regionId){
    // 已經選過地點就先開那一區，否則依時區猜
    const mine = manualPlace && REGIONS.find(r => r.areas.some(x => x[2] === manualPlace.lat && x[3] === manualPlace.lng));
    regionId = mine ? mine.id : defaultRegion();
  }
  const rc = $('region-chips'), ac = $('area-chips');
  rc.textContent = ''; ac.textContent = '';
  REGIONS.forEach(r => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.region = r.id;
    chip.textContent = areaName(r);
    chip.setAttribute('aria-pressed', String(r.id === regionId));
    rc.appendChild(chip);
  });
  REGIONS.find(r => r.id === regionId).areas.forEach(([zh, en, lat, lng], i) => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.area = i;
    chip.textContent = lang === 'en' ? en : zh;
    const on = manualPlace && manualPlace.lat === lat && manualPlace.lng === lng;
    chip.setAttribute('aria-pressed', String(!!on));
    ac.appendChild(chip);
  });
}
function openPlacePicker(msgKey, thenGo){
  cancelRun();
  goAfterPick = !!thenGo;
  $('place-msg').hidden = !msgKey;
  if(msgKey) $('place-msg').textContent = t(msgKey);
  renderPlacePicker();
  showStep('place');
}
$('btn-change-loc').addEventListener('click', () => { clearError(); openPlacePicker(null, false); });
$('region-chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  regionId = chip.dataset.region;
  renderPlacePicker();
});
$('area-chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const [zh, en, lat, lng] = REGIONS.find(r => r.id === regionId).areas[Number(chip.dataset.area)];
  manualPlace = {zh, en, lat, lng};
  store.set('todayeat_place', manualPlace);
  renderPrefs();
  if(goAfterPick) go(); else showStep('start');
});
$('btn-use-gps').addEventListener('click', () => {
  manualPlace = null;
  store.del('todayeat_place');
  memLoc = null; store.del('todayeat_loc'); // 重新問一次定位
  renderPrefs();
  go();
});

/* ============ 取得餐廳（OpenStreetMap Overpass，不需要 API key） ============ */
async function fetchPlaces(loc, radius, signal){
  const q = `[out:json][timeout:15];nwr["amenity"~"^(restaurant|fast_food|food_court)$"]["name"]`
          + `(around:${radius},${loc.lat},${loc.lng});out center tags;`;
  const ctrls = OVERPASS_ENDPOINTS.map(() => new AbortController());
  const abortAll = () => ctrls.forEach(c => c.abort());
  signal.addEventListener('abort', abortAll);
  const timer = setTimeout(abortAll, FETCH_TIMEOUT_MS);
  try{
    const json = await Promise.any(OVERPASS_ENDPOINTS.map(async (url, i) => {
      const res = await fetch(url, {method:'POST', body:new URLSearchParams({data:q}), signal:ctrls[i].signal});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if(!Array.isArray(j.elements) || j.remark) throw new Error('incomplete response'); // remark = 伺服器中途出錯
      return j;
    }));
    const now = new Date();
    return json.elements.map(el => toPlace(el, loc, now)).filter(Boolean);
  }finally{
    clearTimeout(timer);
    abortAll(); // 中止其餘還沒回應的
    signal.removeEventListener('abort', abortAll);
  }
}

/* 餐廳清單存在本機：同一個地方（例如公司）第二次打開不用再等網路 */
const CACHE_KEY = 'todayeat_places_v2';
function cacheFind(loc, radius, anyAge){
  return store.get(CACHE_KEY, []).find(c =>
    c.r >= radius &&
    (anyAge || Date.now() - c.ts < PLACES_TTL_MS) &&
    haversineM(loc.lat, loc.lng, c.lat, c.lng) <= CACHE_REUSE_M) || null;
}
function cacheSave(loc, radius, places){
  const rest = store.get(CACHE_KEY, []).filter(c =>
    haversineM(loc.lat, loc.lng, c.lat, c.lng) > CACHE_REUSE_M || c.r > radius);
  rest.unshift({lat:loc.lat, lng:loc.lng, r:radius, ts:Date.now(), places});
  store.set(CACHE_KEY, rest.slice(0, 4));
}
function fromCache(c, loc, radius){
  const now = new Date(); // 距離和營業狀態依現在的時間重新計算
  return c.places.map(p => Object.assign({}, p, {
    distanceM: haversineM(loc.lat, loc.lng, p.lat, p.lng),
    open: isOpenAt(p.hours, now)
  })).filter(p => p.distanceM <= radius);
}
async function getPlaces(loc, radius, signal){
  const hit = cacheFind(loc, radius, false);
  if(hit) return fromCache(hit, loc, radius);
  try{
    const places = await fetchPlaces(loc, radius, signal);
    cacheSave(loc, radius, places);
    return places;
  }catch(e){
    const stale = signal.aborted ? null : cacheFind(loc, radius, true); // 網路不通就先用舊清單
    if(stale) return fromCache(stale, loc, radius);
    throw e;
  }
}

/* ============ 主流程：按一下 → 定位 → 找餐廳 → 自動轉 ============ */
async function go(){
  clearError();
  cancelRun();
  const my = run;
  runCtrl = new AbortController();
  const signal = runCtrl.signal;
  showStep('loading');
  let loc = manualPlace || getCachedLoc();
  if(!loc){
    setLoading(t('locating'), t('locatingSub'));
    try{ loc = await locate(); }
    catch(key){ if(my === run) openPlacePicker(key, true); return; } // 定位不行就改用選的
    if(my !== run) return; // 中途按了取消
  }
  setLoading(t('searching'), t('searchingSub'));
  startLoadingClock();
  try{
    // 先看選定的距離；完全沒有可選的才逐步放遠
    const want = walkRadius(prefs.min);
    for(const d of [want, ...FETCH_BUCKETS.filter(b => b > want)]){
      const places = await getPlaces(loc, FETCH_BUCKETS.find(b => b >= d), signal);
      if(my !== run) return;
      pool = places.filter(p => p.distanceM <= d); poolRadius = d;
      if(eligible(d, false, false).length) break;
    }
  }catch(e){
    if(my === run) showError(t('serverDown'));
    return;
  }
  if(!pool.length) return showError(t('noData', fmtDist(poolRadius)));
  startWheel();
}
function startWheel(){
  rejected.clear();
  if(!buildWheel()) return showError(t(prefs.veg ? 'noVeg' : 'noOpen'));
  showWheelAndSpin();
}
function showWheelAndSpin(){
  showStep('wheel');
  const token = spinToken;
  setTimeout(() => { if(token === spinToken) spin(); }, 450); // 等畫面出現後再轉
}
$('btn-go').addEventListener('click', go);

/* ============ 決定哪幾間上輪盤 ============ */
function recentIds(){
  const cutoff = Date.now() - AVOID_REPEAT_DAYS*86400000;
  return new Set(store.get('todayeat_history', []).filter(h => h.ts > cutoff).map(h => h.id));
}
function eligible(dist, skipRejected, skipRecent){
  const recent = skipRecent ? recentIds() : new Set();
  return pool.filter(p =>
    p.distanceM <= dist &&
    p.open !== false &&                 // 確定已打烊才剔除；不確定的照樣列入，結果頁會提醒
    (!prefs.veg || p.veg) &&
    !(skipRejected && rejected.has(p.id)) &&
    !recent.has(p.id));
}
function buildWheel(){
  // 逐步放寬：先套用全部條件 → 不管「這次不想吃」→ 連「這兩天吃過」也不管
  for(const [skipRejected, skipRecent] of [[true,true],[false,true],[false,false]]){
    const list = eligible(poolRadius, skipRejected, skipRecent);
    if(!list.length) continue;
    if(!skipRejected) rejected.clear();
    wheel = shuffle(list).slice(0, WHEEL_MAX);
    let note = list.length > wheel.length ? t('noteSome', list.length, wheel.length) : t('noteAll', list.length);
    if(poolRadius > walkRadius(prefs.min)) note += t('noteWiden', fmtDist(walkRadius(prefs.min)), fmtDist(poolRadius));
    $('wheel-note').textContent = note;
    drawWheel();
    return true;
  }
  return false;
}

/* ============ 畫輪盤 ============ */
function drawWheel(){
  const canvas = $('wheel-canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 280*dpr; canvas.height = 280*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,280,280);
  const n = wheel.length, seg = 2*Math.PI/n, c = 140;
  wheel.forEach((p, i) => {
    const start = -Math.PI/2 + i*seg;
    ctx.beginPath();
    ctx.moveTo(c,c);
    ctx.arc(c,c,c,start,start+seg);
    ctx.closePath();
    // 最後一格和第一格同色就換一個顏色
    let color = PALETTE[i % PALETTE.length];
    if(n > 1 && i === n-1 && color === PALETTE[0]) color = PALETTE[3];
    ctx.fillStyle = color;
    ctx.fill();
    if(n > 1){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }

    ctx.save();
    ctx.translate(c,c);
    ctx.rotate(start + seg/2);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = '700 13px "Noto Sans TC", sans-serif';
    // 依實際寬度截短，中英文都適用
    let label = placeName(p);
    if(ctx.measureText(label).width > 92){
      const chars = Array.from(label);
      while(chars.length > 1 && ctx.measureText(chars.join('') + '…').width > 92) chars.pop();
      label = chars.join('').trim() + '…';
    }
    ctx.fillText(label, c-14, 0);
    ctx.restore();
  });
  const dial = $('wheel-dial');
  rotation = 0;
  dial.style.transition = 'none';
  dial.style.transform = 'rotate(0deg)';
  void dial.offsetWidth; // 強制重排，讓下一次轉動有動畫
}

/* ============ 轉 ============ */
function spin(){
  if(spinning || !wheel.length) return;
  spinning = true;
  const token = ++spinToken;
  $('btn-spin').disabled = true;
  const n = wheel.length, seg = 360/n;
  const winner = Math.floor(Math.random()*n);          // 先公平抽出，再轉到那一格
  const theta = winner*seg + seg*(0.15 + Math.random()*0.7);
  const base = Math.ceil(rotation/360)*360;
  rotation = base + (5 + Math.floor(Math.random()*3))*360 + (360 - theta);

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dial = $('wheel-dial');
  dial.style.transition = reduce ? 'none' : 'transform 4s cubic-bezier(0.15,0.65,0.1,1)';
  dial.style.transform = `rotate(${rotation}deg)`;

  let done = false;
  const finish = () => {
    if(done || token !== spinToken) return; // 已經回首頁就不要再跳結果
    done = true;
    spinning = false;
    $('btn-spin').disabled = false;
    showResult(wheel[winner]);
  };
  if(reduce){ setTimeout(finish, 400); }
  else{
    dial.addEventListener('transitionend', finish, {once:true});
    setTimeout(finish, 4700); // 分頁在背景時 transitionend 不一定會觸發，保底
  }
}
$('btn-spin').addEventListener('click', spin);

/* ============ 結果 ============ */
function showResult(p){
  current = p;
  $('result-name').textContent = placeName(p);

  const walkMin = Math.max(1, Math.round(p.distanceM / WALK_M_PER_MIN));
  const dist = manualPlace ? t('fromPlace', areaName(manualPlace), fmtDist(p.distanceM)) : fmtDist(p.distanceM);
  $('result-meta').textContent = [cuisineText(p), dist, t('walk', walkMin)].filter(Boolean).join(t('sep'));

  $('result-status').textContent = p.open === true ? t('openNow') : t('openUnknown');
  $('result-detail').textContent = [p.address, p.hours ? t('hours', p.hours) : ''].filter(Boolean).join('\n');
  $('result-detail').style.whiteSpace = 'pre-line';

  const mapBox = $('result-map');
  mapBox.textContent = '';
  const d = 0.003;
  const frame = document.createElement('iframe');
  frame.loading = 'lazy';
  frame.title = t('mapTitle');
  frame.src = 'https://www.openstreetmap.org/export/embed.html?bbox='
    + [p.lng-d, p.lat-d, p.lng+d, p.lat+d].join('%2C')
    + '&layer=mapnik&marker=' + p.lat + '%2C' + p.lng;
  mapBox.appendChild(frame);

  $('btn-navigate').href = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking`;
  $('link-reviews').href = `https://www.google.com/maps/search/${encodeURIComponent(p.name)}/@${p.lat},${p.lng},18z`;
  const phone = $('btn-phone');
  const shown = (p.phone || '').split(';')[0].trim();
  const tel = shown.replace(/[^\d+]/g,'');
  phone.hidden = !tel;
  if(tel){
    phone.href = 'tel:' + tel;
    phone.textContent = t('call', shown);
  }
  $('toast').textContent = '';
  showStep('result');
}

$('btn-navigate').addEventListener('click', () => {
  if(!current) return;
  addHistory(current);
  $('toast').textContent = t('saved', AVOID_REPEAT_DAYS);
});
$('btn-reject').addEventListener('click', () => {
  if(current) rejected.add(current.id);
  if(!buildWheel()) return showError(t('noMore'));
  showWheelAndSpin();
});

/* ============ 紀錄 ============ */
function addHistory(p){
  const list = store.get('todayeat_history', []);
  if(list[0] && list[0].id === p.id && Date.now() - list[0].ts < 3*3600000) return; // 連按不重複記錄
  list.unshift({id:p.id, name:p.name, nameEn:p.nameEn || '', lat:p.lat, lng:p.lng, ts:Date.now()});
  store.set('todayeat_history', list.slice(0,60));
}
function renderHistory(){
  const wrap = $('history-list');
  wrap.textContent = '';
  const list = store.get('todayeat_history', []);
  $('btn-history-clear').hidden = !list.length;
  if(!list.length){
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = t('historyEmpty');
    wrap.appendChild(empty);
    return;
  }
  list.forEach(h => {
    const item = document.createElement('div'); item.className = 'history-item';
    const left = document.createElement('div');
    const name = document.createElement('div'); name.className = 'h-name'; name.textContent = placeName(h);
    const time = document.createElement('div'); time.className = 'h-time';
    time.textContent = new Date(h.ts).toLocaleString(t('locale'), {month:'numeric', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit'});
    left.append(name, time);
    item.appendChild(left);
    if(h.lat != null && h.lng != null){
      const a = document.createElement('a');
      a.href = `https://www.google.com/maps/search/${encodeURIComponent(h.name)}/@${h.lat},${h.lng},18z`;
      a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('map');
      item.appendChild(a);
    }
    wrap.appendChild(item);
  });
}
function openHistory(fromResult){
  renderHistory();
  $('btn-history-back').hidden = !fromResult;
  showStep('history');
}
$('btn-history-start').addEventListener('click', () => openHistory(false));
$('btn-history-result').addEventListener('click', () => openHistory(true));
$('btn-history-back').addEventListener('click', () => showStep('result'));
$('btn-history-clear').addEventListener('click', () => {
  if(confirm(t('clearConfirm'))){ store.set('todayeat_history', []); renderHistory(); }
});

buildWalkIcons();
applyLang();
showStep('start');
</script>
