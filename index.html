<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日吃甚麼 — 命運大輪盤</title>
<meta name="description" content="吃飯時間不用想，按一下，輪盤幫你挑一間附近的餐廳。">
<meta name="theme-color" content="#FFF8EC">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EC; --card:#FFFFFF; --ink:#2B2118;
    --tomato:#FF6B4A; --tomato-deep:#E85436; --mustard:#FFC94D;
    --teal:#2FB6A5; --teal-deep:#22988A; --plum:#8A5A8C;
    --muted:#8C7D6C; --line:#F0E4D0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    font-family:'Noto Sans TC',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 18%, rgba(255,201,77,0.35), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(47,182,165,0.25), transparent 42%),
      radial-gradient(circle at 82% 88%, rgba(255,107,74,0.22), transparent 45%),
      var(--cream);
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:12px;
    -webkit-font-smoothing:antialiased;
  }
  .app-shell{
    width:100%; max-width:460px;
    background:radial-gradient(circle at calc(100% - 20px) 20px, rgba(255,201,77,0.25) 0 80px, transparent 81px), var(--card); /* 右上角的裝飾圓 */
    border-radius:28px;
    box-shadow:0 30px 70px -30px rgba(43,33,24,0.35);
    padding:28px 22px 16px;
    position:relative; overflow:hidden;
  }
  .step{display:none; position:relative;}
  .step.active{display:block; animation:fade-up 0.35s ease;}
  @keyframes fade-up{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

  h1{
    font-family:'ZCOOL KuaiLe',sans-serif; font-weight:400;
    font-size:30px; line-height:1.2; text-align:center; color:var(--tomato-deep); margin-bottom:4px;
  }
  .subtitle{text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:12px;}
  .icon-row{text-align:center; font-size:34px; line-height:1.2; margin-bottom:12px;}

  .btn{
    display:block; width:100%; border:none; border-radius:100px;
    padding:14px; font-family:inherit; font-size:16px; font-weight:700;
    cursor:pointer; text-align:center; text-decoration:none;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn + .btn{margin-top:10px;}
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible, .chip:focus-visible, .link:focus-visible{outline:2px solid var(--plum); outline-offset:3px;}
  .btn-primary{background:var(--tomato); color:#fff; box-shadow:0 10px 24px -8px rgba(255,107,74,0.6);}
  .btn-primary:hover{background:var(--tomato-deep);}
  .btn-go{background:var(--teal); color:#fff; box-shadow:0 10px 24px -8px rgba(47,182,165,0.55);}
  .btn-go:hover{background:var(--teal-deep);}
  .btn-secondary{background:var(--line); color:var(--ink);}
  .btn-secondary:hover{background:#E7D8BE;}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}

  .link{
    background:none; border:none; font-family:inherit; font-size:13px;
    color:var(--plum); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  .link-row{display:flex; justify-content:center; gap:20px; margin-top:14px; flex-wrap:wrap;}

  .hint{text-align:center; font-size:12.5px; color:var(--muted); line-height:1.6;}
  .error-box{
    background:#FDEDEA; color:#B03A22; border-radius:14px;
    padding:14px 16px; font-size:13.5px; line-height:1.6; margin-bottom:16px; display:none;
  }
  .error-box.show{display:block;}

  .prefs{border-top:1px solid var(--line); margin-top:14px; padding-top:12px;}
  .pref-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .pref-row .chip, #nick-chips .chip, #pop-chips .chip{margin:0;}
  .walk-value{text-align:center; margin:0 0 2px;}
  .walk-value b{font-family:'ZCOOL KuaiLe',sans-serif; font-weight:400; font-size:24px; color:var(--tomato-deep);}
  .walk-value span{font-size:12.5px; color:var(--muted); margin-left:6px;}
  .walk-slider{
    -webkit-appearance:none; appearance:none; display:block; width:100%; height:32px; margin:0;
    background:transparent; cursor:pointer; touch-action:pan-y;
  }
  .walk-slider::-webkit-slider-runnable-track{
    height:10px; border-radius:10px;
    background:linear-gradient(to right, var(--tomato) var(--fill,30%), var(--line) var(--fill,30%));
  }
  .walk-slider::-moz-range-track{height:10px; border-radius:10px; background:var(--line);}
  .walk-slider::-moz-range-progress{height:10px; border-radius:10px; background:var(--tomato);}
  .walk-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:28px; height:28px; margin-top:-9px; border-radius:50%;
    background:#fff; border:4px solid var(--tomato); box-shadow:0 3px 8px rgba(43,33,24,0.25);
  }
  .walk-slider::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%;
    background:#fff; border:4px solid var(--tomato); box-shadow:0 3px 8px rgba(43,33,24,0.25);
  }
  .walk-slider:focus-visible{outline:2px solid var(--plum); outline-offset:4px; border-radius:10px;}
  /* 圖示對齊拉桿上的 1、7、13、20 分鐘；左右各留半個拉桿圓鈕的寬度 */
  .walk-icons{position:relative; height:72px; margin:4px 14px 10px;}
  .walk-icon{
    position:absolute; top:0; width:56px; margin-left:-28px; padding:0;
    background:none; border:none; cursor:pointer; font-family:inherit; text-align:center;
    color:var(--muted); opacity:0.45; transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .walk-icon svg{display:block; width:44px; height:52px; margin:0 auto;}
  .walk-icon small{display:block; font-size:11px; margin-top:2px; white-space:nowrap;}
  .walk-icon[aria-pressed="true"]{opacity:1; color:var(--tomato-deep); transform:scale(1.18);}
  .walk-icon[aria-pressed="true"] small{font-weight:700;}
  .walk-icon[aria-pressed="true"] svg{animation:walk-bob 0.9s ease-in-out infinite;}
  .walk-icon[data-kind="dance"][aria-pressed="true"] svg{animation:walk-dance 0.6s ease-in-out infinite;}
  .walk-icon[data-kind="tired"][aria-pressed="true"] svg, .walk-icon[data-kind="cane"][aria-pressed="true"] svg{animation-duration:1.8s;}
  @keyframes walk-bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);}}
  @keyframes walk-dance{0%,100%{transform:rotate(-9deg);} 50%{transform:rotate(9deg);}}
  .pref-label{font-size:13px; font-weight:700; margin-bottom:2px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    padding:8px 14px; border-radius:100px; font-size:13px; font-weight:500;
    cursor:pointer; font-family:inherit;
  }
  .chip[aria-pressed="true"]{background:var(--tomato); border-color:var(--tomato); color:#fff; font-weight:700;}

  .spinner{
    width:56px; height:56px; border-radius:50%;
    border:5px solid var(--line); border-top-color:var(--tomato);
    margin:32px auto 24px; animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{text-align:center; font-size:15px; font-weight:500;}
  .loading-sub{text-align:center; font-size:12.5px; color:var(--muted); margin:6px 0 24px; min-height:18px;}

  /* 頂列：左邊首頁，右邊語言 */
  .topbar{display:flex; justify-content:space-between; align-items:center; min-height:38px; margin:-12px 0 10px;}
  .pill-btn{
    display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 16px 0 12px;
    border:1.5px solid var(--line); border-radius:100px; background:#fff; color:var(--ink);
    font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 10px -6px rgba(43,33,24,0.35); transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .pill-btn svg{width:18px; height:18px; color:var(--tomato-deep);}
  .pill-btn:hover{border-color:var(--tomato);}
  .pill-btn:active{transform:scale(0.96);}
  .seg{display:inline-flex; padding:3px; border-radius:100px; background:var(--line);}
  .seg button{
    border:none; background:none; height:32px; padding:0 14px; border-radius:100px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .seg button[aria-pressed="true"]{background:#fff; color:var(--tomato-deep); box-shadow:0 1px 4px rgba(43,33,24,0.2);}
  .seg-wide{display:flex;}
  .seg-wide button{flex:1; height:38px; font-size:14px;}
  .pill-btn:focus-visible, .seg button:focus-visible, .info-btn:focus-visible, .sugg-row:focus-visible{outline:2px solid var(--plum); outline-offset:2px;}

  .where{display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:4px 8px; font-size:13px; margin-top:14px;}
  .info-btn{
    width:22px; height:22px; border-radius:50%; border:none; padding:0; flex:none;
    background:var(--mustard); color:#5A3E00; font-family:inherit; font-size:13px; font-weight:900; line-height:22px; cursor:pointer;
  }

  /* 選地點 */
  .place-sub{text-align:center; font-size:13px; color:var(--muted); margin-bottom:16px; line-height:1.6;}
  .place-note{text-align:center; font-size:13px; color:#8A6300; background:#FFF3D6; border-radius:12px; padding:10px 12px; margin-bottom:14px; line-height:1.6;}
  .search{position:relative; margin:14px 0 12px;}
  .search input{
    width:100%; height:50px; border-radius:16px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    padding:0 46px; font-family:inherit; font-size:16px; /* 16px 以上 iPhone 才不會自動放大畫面 */
    -webkit-appearance:none; appearance:none;
  }
  .search input::placeholder{color:#B9AC9B;}
  .search input:focus{outline:none; border-color:var(--tomato); box-shadow:0 0 0 4px rgba(255,107,74,0.15);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search .s-icon{position:absolute; left:15px; top:50%; width:20px; height:20px; margin-top:-10px; color:var(--muted); pointer-events:none;}
  .search .s-clear{
    position:absolute; right:9px; top:50%; width:32px; height:32px; margin-top:-16px; border-radius:50%;
    border:none; background:var(--line); color:var(--ink); font-size:15px; line-height:32px; padding:0; cursor:pointer;
  }
  .sugg{border:1.5px solid var(--line); border-radius:16px; overflow-y:auto; max-height:34vh; max-height:34dvh; margin-bottom:10px; background:#fff;}
  .sugg-row{
    display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; background:#fff;
    border:none; border-top:1px solid var(--line); text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .sugg-row:first-child{border-top:none;}
  .sugg-row:hover{background:var(--cream);}
  .sugg-row .s-pin{flex:none; width:32px; height:32px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:15px;}
  .sugg-row .s-main{flex:1; min-width:0;}
  .sugg-row .s-name{font-size:15px; font-weight:700; overflow-wrap:anywhere;}
  .sugg-row .s-sub{font-size:12px; color:var(--muted); margin-top:1px; overflow-wrap:anywhere;}
  .sugg-row.action .s-name{color:var(--plum);}
  .sugg-row.action .s-pin{background:#F3E9F4;}
  .sugg-note{padding:12px 14px; font-size:13.5px; color:var(--muted); text-align:center; border-top:1px solid var(--line); white-space:pre-line; line-height:1.6;}
  .sugg-note:first-child{border-top:none;}
  .saved-row{display:flex; align-items:stretch; border-top:1px solid var(--line); background:#fff;}
  .saved-row:first-child{border-top:none;}
  .saved-row .s-hit{flex:1; min-width:0; display:flex; align-items:center; gap:12px; padding:11px 14px; background:none; border:none; text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);}
  .saved-row .s-hit:hover{background:var(--cream);}
  .saved-row .s-pin{flex:none; width:32px; height:32px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:15px;}
  .saved-row .s-main{flex:1; min-width:0;}
  .saved-row .s-name{font-size:15px; font-weight:700; overflow-wrap:anywhere;}
  .saved-row .s-sub{font-size:12px; color:var(--muted); margin-top:1px; overflow-wrap:anywhere;}
  .saved-row .s-on{flex:none; font-size:12px; font-weight:700; color:var(--teal-deep); white-space:nowrap;}
  .saved-row .s-del{flex:none; width:44px; border:none; border-left:1px solid var(--line); background:none; color:var(--muted); font-size:14px; cursor:pointer;}
  .saved-row .s-del:hover{background:#FDEDEA; color:#B03A22;}
  .found-card{border:1.5px solid var(--teal); background:#EFFAF8; border-radius:16px; padding:12px 14px; margin-bottom:12px;}
  .found-card .s-name{font-size:16px; font-weight:700; overflow-wrap:anywhere;}
  .found-card .s-sub{font-size:12.5px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere;}
  .search.plain{margin:6px 0 10px;}
  .search.plain input{padding:0 16px;}
  .pop-label{font-size:12.5px; font-weight:700; color:var(--muted); margin:2px 0 10px;}

  /* 彈出視窗 */
  .modal{position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(43,33,24,0.5); animation:fade-in 0.2s ease;}
  .modal-card{width:100%; max-width:380px; background:#fff; border-radius:24px; padding:26px 22px 20px; box-shadow:0 30px 70px -20px rgba(43,33,24,0.6); animation:fade-up 0.25s ease;}
  .modal-card{max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); overflow-y:auto;}
  .modal-card .chips{margin-bottom:12px;}
  .modal-card .fnote{font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:14px;}
  .modal-card h2{font-size:18px; font-weight:700; margin-bottom:12px;}
  .modal-card p{font-size:14px; line-height:1.75; margin-bottom:12px;}
  .modal-card p:last-of-type{margin-bottom:18px;}
  @keyframes fade-in{from{opacity:0;} to{opacity:1;}}
  .wheel-note{text-align:center; font-size:13.5px; margin-bottom:10px; line-height:1.6; white-space:pre-line;}
  .wheel-stage{position:relative; width:280px; height:280px; margin:8px auto 22px;}
  .pointer{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent;
    border-top:24px solid var(--plum);
    z-index:3; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  .wheel-dial{
    width:280px; height:280px; border-radius:50%;
    box-shadow:0 0 0 8px #fff, 0 0 0 10px var(--line), 0 20px 40px -15px rgba(43,33,24,0.4);
  }
  .wheel-dial canvas{display:block; width:280px; height:280px; border-radius:50%;}
  .wheel-hub{
    position:absolute; top:50%; left:50%; width:52px; height:52px;
    transform:translate(-50%,-50%); background:#fff; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2); z-index:2;
  }

  .result-label{text-align:center; font-size:13px; color:var(--muted); margin-bottom:4px;}
  .result-name{
    text-align:center; font-family:'ZCOOL KuaiLe',sans-serif;
    font-size:28px; line-height:1.25; color:var(--tomato-deep);
    margin-bottom:6px; overflow-wrap:anywhere;
  }
  .result-meta{text-align:center; font-size:14px; margin-bottom:6px;}
  .result-status{text-align:center; font-size:13px; margin-bottom:4px;}
  .result-detail{text-align:center; font-size:12.5px; color:var(--muted); line-height:1.6; overflow-wrap:anywhere;}
  .result-map{
    width:100%; height:clamp(84px, 17vh, 150px); height:clamp(84px, 17dvh, 150px); border-radius:14px; overflow:hidden;
    margin:10px 0 12px; border:1px solid var(--line); /* 高度跟著螢幕縮放，矮螢幕也不用捲動 */
  }
  .result-map iframe{width:100%; height:100%; border:0;}
  .toast{text-align:center; font-size:12.5px; color:var(--teal-deep); min-height:18px; margin:6px 0 0;}

  .section-title{text-align:center; font-size:16px; font-weight:700; margin-bottom:6px;}
  .history-item{
    border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .history-item .h-name{font-weight:700; font-size:15px; overflow-wrap:anywhere;}
  .history-item .h-time{font-size:12px; color:var(--muted); margin-top:2px;}
  .history-item a{font-size:13px; color:var(--plum); white-space:nowrap;}
  #history-list{max-height:46vh; max-height:46dvh; overflow-y:auto; margin-bottom:12px; -webkit-overflow-scrolling:touch;}
  .history-empty{text-align:center; font-size:13.5px; color:var(--muted); padding:28px 0;}

  .footer{
    text-align:center; font-size:11px; color:var(--muted);
    margin-top:14px; padding-top:10px; border-top:1px solid var(--line); line-height:1.6;
  }
  .footer a{color:inherit;}

  /* 矮螢幕（例如 iPhone SE）：再縮一點，盡量不用捲動 */
  @media (max-height:620px){
    body{padding:8px;}
    .app-shell{padding:22px 20px 10px;}
    .icon-row{display:none;}
    .subtitle{margin-bottom:10px;}
    .btn{padding:12px;}
    .btn + .btn{margin-top:8px;}
    .prefs{margin-top:10px; padding-top:10px;}
    .walk-icons{height:68px; margin-bottom:6px;}
    .wheel-stage{transform:scale(0.84); margin:-14px auto 0;}
    .result-name{font-size:25px;}
    .result-map{height:60px; margin:8px 0;}
    .toast{min-height:0; margin:2px 0 0;}
    .link-row{margin-top:8px;}
    .footer{margin-top:8px; padding-top:6px;}
    #history-list{max-height:36vh; max-height:36dvh;}
    .sugg{max-height:24vh; max-height:24dvh;}
    .search{margin:10px 0;}
    .place-sub{margin-bottom:10px;}
  }
  @media (prefers-reduced-motion: reduce){
    .spinner, .step.active, .walk-icon svg{animation:none !important;}
  }
</style>
</head>
<body>

<main class="app-shell">

  <div class="topbar">
    <button class="pill-btn" id="btn-home" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5.5h4v5.5"/></svg>
      <span data-i18n="home"></span>
    </button>
    <button class="pill-btn" id="btn-history-start">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span data-i18n="historyShort"></span>
    </button>
    <span></span>
    <div class="seg" id="lang-toggle" role="group" aria-label="Language / 語言">
      <button data-lang="zh">中文</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <!-- 首頁 -->
  <section class="step active" id="step-start">
    <h1 data-i18n="title"></h1>
    <p class="subtitle" data-i18n="subtitle"></p>
    <div class="icon-row" aria-hidden="true">🍜🎡🥡</div>
    <div class="error-box" id="error-box" role="alert"></div>
    <button class="btn btn-primary" id="btn-go" data-i18n="go"></button>
    <div class="where">
      <button class="info-btn" id="btn-loc-info">!</button>
      <span id="where-label"></span>
      <button class="link" id="btn-change-loc" data-i18n="changePlace"></button>
    </div>

    <div class="prefs">
      <div class="pref-label" data-i18n="distLabel"></div>
      <div class="walk-value"><b id="walk-min"></b><span id="walk-dist"></span></div>
      <input class="walk-slider" id="walk-slider" type="range" min="1" max="20" step="1">
      <div class="walk-icons" id="walk-icons"></div>
      <div class="pref-row">
        <button class="chip" id="chip-veg" aria-pressed="false" data-i18n="vegOnly"></button>
        <button class="chip" id="btn-more" aria-pressed="false"></button>
      </div>
    </div>
  </section>

  <!-- 載入 -->
  <section class="step" id="step-loading" aria-live="polite">
    <div class="spinner"></div>

/* PURE-START —— 以下是純函式，不碰 DOM */
const DAY_KEYS = ['su','mo','tu','we','th','fr','sa'];

function parseDays(part){
  const set = new Set();
  if(!part){ for(let i=0;i<7;i++) set.add(i); return set; }
  for(const tok of part.split(',')){
    const t = tok.trim();
    if(!t) continue;
    if(t === 'ph' || t === 'sh') continue; // 國定假日／學校假期的規則略過
    const m = t.match(/^(mo|tu|we|th|fr|sa|su)(?:\s*-\s*(mo|tu|we|th|fr|sa|su))?$/);
    if(!m) return null;
    const a = DAY_KEYS.indexOf(m[1]);
    const b = m[2] ? DAY_KEYS.indexOf(m[2]) : a;
    for(let d=a;; d=(d+1)%7){ set.add(d); if(d===b) break; }
  }
  return set;
}

function parseTimes(part){
  if(part === 'off' || part === 'closed') return [];
  if(part === '24/7') return [[0,1440]];
  const out = [];
  for(const tok of part.split(',')){
    const m = tok.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    const a = +m[1]*60 + +m[2];
    let b = +m[3]*60 + +m[4];
    if(b <= a) b += 1440; // 跨夜
    out.push([a,b]);
  }
  return out;
}

// 解讀 OSM opening_hours 的常見寫法。回傳 true／false；看不懂或沒有資料則回傳 null。
function isOpenAt(str, now){
  if(!str) return null;
  const s = String(str).trim().toLowerCase();
  if(s === '24/7') return true;
  const today = now.getDay(), yday = (today+6)%7;
  const mins = now.getHours()*60 + now.getMinutes();
  let todayRanges = null, ydayRanges = null, any = false;
  for(const raw of s.split(';')){
    const rule = raw.trim();
    if(!rule) continue;
    const idx = rule.search(/\d|off|closed/);
    if(idx < 0) return null;
    const days  = parseDays(rule.slice(0,idx).replace(/[:\s,]+$/,'').trim());
    const times = parseTimes(rule.slice(idx).trim());
    if(!days || !times) return null;
    if(!days.size) continue;
    any = true;
    if(days.has(today)) todayRanges = times; // 後面的規則覆蓋前面的
    if(days.has(yday))  ydayRanges  = times;
  }
  if(!any) return null;
  if(todayRanges && todayRanges.some(([a,b]) => mins >= a && mins < b)) return true;
  if(ydayRanges  && ydayRanges.some(([a,b]) => b > 1440 && mins < b-1440)) return true;
  return false;
}

function haversineM(lat1,lng1,lat2,lng2){
  const R = 6371000, rad = x => x*Math.PI/180;
  const dLat = rad(lat2-lat1), dLng = rad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(a)));
}

function cuisineKeys(tags){
  const raw = (tags.cuisine || '').toLowerCase().split(/[;,]/).map(x => x.trim()).filter(Boolean);
  const keys = [...new Set(raw)].slice(0,4);
  if(keys.length) return keys;
  if(tags.amenity === 'fast_food' || tags.amenity === 'food_court') return [tags.amenity];
  return [];
}

  hotpot:   {keys:['hotpot','hot_pot','shabu'], name:/火鍋|鍋物|涮涮|麻辣燙|打邊爐|shabu|hot ?pot/i},
  noodle:   {keys:['noodle','noodles','ramen','beef_noodle','udon','soba'], name:/麵|米線|河粉|粉麵|noodle|ramen/i},
  fast:     {keys:['fast_food','burger','fried_chicken','chicken'],
             name:/麥當勞|肯德基|摩斯|漢堡王|吉野家|大家樂|大快活|頂呱呱|丹丹|McDonald|KFC|Subway|Burger King|MOS/i}
};
const SPICY_KEYS = ['sichuan','hunan','thai','korean','indian','mexican','curry'];
const SPICY_NAME = /麻辣|辣|川|湘|泡菜|咖哩|咖喱|泰式|泰國|韓式|韓國|酸菜魚|spicy|sichuan|szechuan|kimchi|curry/i;
const PRICE_HIGH_KEYS = ['fine_dining','french','steak_house','kaiseki','teppanyaki'];
const PRICE_HIGH_NAME = /omakase|鐵板燒|懷石|牛排|扒房|steak|fine dining|法式|法國|割烹|鮨/i;
const PRICE_LOW_KEYS = ['noodle','noodles','beef_noodle','bento','porridge','congee','breakfast','dumpling','dumplings','sandwich','fried_chicken'];
const PRICE_LOW_NAME = /麵|粥|便當|小吃|小食|豆漿|早餐|飯糰|滷味|鹹酥雞|茶餐廳|冰室|粉麵|快餐|速食/;
function classify(p){
  const keys = p.cuisine || [], name = (p.name || '') + ' ' + (p.nameEn || '');
  const groups = Object.keys(CUISINE_GROUPS).filter(g => {
    const def = CUISINE_GROUPS[g];
    return keys.some(k => def.keys.includes(k)) || def.name.test(name) || (g === 'fast' && p.kind === 'fast_food');
  });
  const spicy = keys.some(k => SPICY_KEYS.includes(k)) || SPICY_NAME.test(name);
  let price = 2; // 1 = 平價小吃、2 = 一般、3 = 高級
  if(keys.some(k => PRICE_HIGH_KEYS.includes(k)) || PRICE_HIGH_NAME.test(name)) price = 3;
  else if(p.kind === 'fast_food' || p.kind === 'food_court' || groups.includes('fast') || keys.some(k => PRICE_LOW_KEYS.includes(k)) || PRICE_LOW_NAME.test(name)) price = 1;
  return {groups, spicy, price};
}

function toPlace(el, loc, now){
  const tags = el.tags || {};
  const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
  const lng = el.lon != null ? el.lon : (el.center && el.center.lon);
  if(!tags.name || lat == null || lng == null) return null;
  const cuisineRaw = (tags.cuisine || '').toLowerCase();
  const yes = v => v === 'yes' || v === 'only';
  return {
    id: el.type + '/' + el.id,
    name: tags.name,
    nameEn: tags['name:en'] || '',
    lat, lng,
    distanceM: haversineM(loc.lat, loc.lng, lat, lng),
    cuisine: cuisineKeys(tags), // OSM 的原始分類，顯示時再依語言轉換
    kind: tags.amenity || '',
    veg: yes(tags['diet:vegetarian']) || yes(tags['diet:vegan']) || /vegetarian|vegan/.test(cuisineRaw),
    open: isOpenAt(tags.opening_hours, now),
    hours: tags.opening_hours || '',
    address: tags['addr:full'] || [tags['addr:street'], tags['addr:housenumber']].filter(Boolean).join(' '),
    phone: tags.phone || tags['contact:phone'] || ''
  };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

  const v = I18N[lang][key];

}

const STEPS = ['start','loading','place','wheel','result','history'];

  $('lang-toggle').hidden = name !== 'start'; // 語言只在首頁切換
  $('btn-history-start').hidden = name !== 'start';
  window.scrollTo(0,0);
}

  renderPrefs();
  showStep('start');
}

function stopLoadingClock(){ clearInterval(loadClock); loadClock = null; }
function startLoadingClock(){
  stopLoadingClock();
  const t0 = Date.now();
  loadClock = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    if(sec >= 12)     $('loading-sub').textContent = t('stillWaiting', sec, FETCH_TIMEOUT_MS/1000);
    else if(sec >= 5) $('loading-sub').textContent = t('slow');
  }, 1000);
}

function getCachedLoc(){
  const c = memLoc || store.get('todayeat_loc', null);
  if(c && Date.now() - c.ts < LOC_TTL_MS){ memLoc = c; return c; }
  memLoc = null;
  return null;
}
// 失敗時 reject 一個 I18N 的 key，選地點頁會用一行字說明
function locate(){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject('geoFailNote');
    let settled = false;
    // 定位提示如果沒人回應，瀏覽器不會自己逾時，所以自己計時
    const dog = setTimeout(() => {
      if(settled) return;
      settled = true;
      reject('geoFailNote');
    }, GEO_WATCHDOG_MS);
    navigator.geolocation.getCurrentPosition(
      pos => {
        if(settled) return;
        settled = true; clearTimeout(dog);
        const c = {lat:pos.coords.latitude, lng:pos.coords.longitude, ts:Date.now()};
        memLoc = c;
        store.set('todayeat_loc', c);
        resolve(c);
      },
      err => {
        if(settled) return;
        settled = true; clearTimeout(dog);
        reject(err.code === 1 ? 'geoOffNote' : 'geoFailNote');
      },
      {timeout:10000, maximumAge:60000}
    );
  });
}

function defaultRegion(){
  let tz = '';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  if(/Macau/i.test(tz)) return 'mo';
  if(/Taipei/i.test(tz)) return 'tw';
  return 'hk';
}
function norm(x){ return String(x).toLowerCase().replace(/臺/g, '台').replace(/[\s／/,，、.]+/g, ''); }
function regionNames(r){ return r.id === 'tw' ? [r.zh, '臺灣', r.en] : [r.zh, r.en]; }
// 把開頭或結尾的「香港」「Taiwan」之類拿掉，剩下的才是要找的地方
function stripRegion(q){
  let s = String(q).trim();
  REGIONS.forEach(r => regionNames(r).forEach(n => {
    const e = n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    s = s.replace(new RegExp('^' + e + '[\\s,，]*', 'i'), '').replace(new RegExp('[\\s,，]*' + e + '$', 'i'), '');
  }));
  return s.trim();
}
function allAreas(){
  const out = [];
  REGIONS.forEach(r => r.areas.forEach(a => out.push({region:r, zh:a[0], en:a[1], lat:a[2], lng:a[3]})));
  return out;
}
function findExact(rest){
  const n = norm(rest);
  const hits = allAreas().filter(a => norm(a.zh) === n || norm(a.en) === n);
  return hits.find(a => a.region.id === regionId) || hits[0] || null;
}
function localMatches(rest){
  const n = norm(rest);
  if(!n) return [];
  return allAreas().filter(a => norm(a.zh).includes(n) || norm(a.en).includes(n))
    .map(a => ({a, rank:(a.region.id === regionId ? 0 : 2) + ((norm(a.zh).startsWith(n) || norm(a.en).startsWith(n)) ? 0 : 1)}))
    .sort((x, y) => x.rank - y.rank).slice(0, 5).map(x => x.a); // 目前選的地區優先，再來是開頭就符合的
}
function fillText(a){ return lang === 'en' ? `${a.en}, ${a.region.en}` : a.region.zh + a.zh; }
function fillInput(a){
  regionId = a.region.id;
  $('place-input').value = fillText(a);
  mapSearch = {token:mapSearch.token + 1, q:'', state:'idle', results:[]};
  renderAddPlace();
}

// OpenStreetMap 的 Nominatim。它不允許邊打邊查、每秒最多一次，所以只在按「確定」時才查
async function nominatim(text, region){
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&bounded=1'
    + '&viewbox=' + region.vb + '&accept-language=' + (lang === 'zh' ? 'zh-TW' : 'en') + '&q=' + encodeURIComponent(text);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  let list;
  try{
    const res = await fetch(url, {signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    list = await res.json();
  }finally{ clearTimeout(timer); }
  const seen = new Set(), results = [];
  (Array.isArray(list) ? list : []).forEach(x => {
    const lat = Number(x.lat), lng = Number(x.lon);
    const parts = String(x.display_name || '').split(',').map(p => p.trim()).filter(Boolean);
    // 門牌地址沒有名稱，用「路名 + 門牌」當名稱
    const name = x.name || (parts.length > 1 ? (lang === 'zh' ? parts[1] + parts[0] : parts[0] + ' ' + parts[1]) : parts[0]);
    if(!name || !isFinite(lat) || !isFinite(lng)) return;
    const key = name + '|' + lat.toFixed(3) + '|' + lng.toFixed(3); // 同一個地方常會回傳好幾筆
    if(seen.has(key)) return;
    seen.add(key);
    results.push({name, sub:parts.slice(1, 4).join(lang === 'zh' ? '・' : ', '), lat:+lat.toFixed(5), lng:+lng.toFixed(5)});
  });
  return results;
}
async function confirmPlace(){
  const q = $('place-input').value.trim();
  if(!q || mapSearch.state === 'loading') return;
  const rest = stripRegion(q);
  if(!rest) return; // 只有地區名，還不夠
  const exact = findExact(rest);
  if(exact) return openNamePlace({name:lang === 'en' ? exact.en : exact.zh, sub:areaName(exact.region), lat:exact.lat, lng:exact.lng}, null);

  // 找「灣仔軒尼詩道100號」這類地址：整句找不到就拿掉前面的區名、再拿掉門牌，最後退回區名本身
  const compact = rest.replace(/\s+/g, '');
  const base = allAreas().filter(a => norm(compact).startsWith(norm(a.zh)) || norm(rest).startsWith(norm(a.en)))
    .sort((x, y) => y.zh.length - x.zh.length)[0] || null;
  if(base) regionId = base.region.id;
  const region = REGIONS.find(r => r.id === regionId);
  const tries = [rest];
  const tail = base && norm(compact).startsWith(norm(base.zh)) ? compact.slice(base.zh.length) : rest;
  if(tail && tail !== rest) tries.push(tail);
  const noNumber = tail.replace(/[0-9０-９]+.*$/, '').trim();
  if(noNumber && !tries.includes(noNumber)) tries.push(noNumber);

  const token = ++mapSearch.token;
  mapSearch = {token, q, state:'loading', results:[]};
  renderAddPlace();
  let results = [], approx = false;
  try{
    for(let i = 0; i < tries.length && !results.length; i++){
      if(i) await new Promise(r => setTimeout(r, 1100));
      results = await nominatim(tries[i], region);
      if(token !== mapSearch.token) return; // 期間改了輸入
      approx = i > 0; // 不是用完整地址找到的，位置只是大概
    }
    // 同一條路常被拆成好幾段回傳，名字一樣又在附近的只留一筆
    results = results.filter((x, i) => !results.slice(0, i).some(y => y.name === x.name && haversineM(x.lat, x.lng, y.lat, y.lng) < 2000));
  }catch(e){
    if(token !== mapSearch.token) return;
    if(!base){ mapSearch = {token, q, state:'error', results:[]}; return renderAddPlace(); }
  }
  mapSearch = {token, q, state:'done', results};
  if(results.length === 1) return openNamePlace(results[0], approx ? t('addrApprox', results[0].name) : null);
  if(!results.length && base) return openNamePlace(
    {name:lang === 'en' ? base.en : base.zh, sub:areaName(base.region), lat:base.lat, lng:base.lng},
    t('addrFallback', lang === 'en' ? base.en : base.zh));
  renderAddPlace(); // 多筆讓他選，或顯示找不到
}

  renderAddPlace();

/* ============ 更多選項：辣度、價位、菜式 ============ */
function activeFilterCount(){ return (prefs.spicy !== 'any') + (prefs.price !== 'any') + prefs.cuisines.length; }
function matchesFilters(p){
  if(!activeFilterCount()) return true;
  const c = classify(p);
  if(prefs.spicy === 'yes' && !c.spicy) return false;
  if(prefs.spicy === 'no' && c.spicy) return false;
  if(prefs.price !== 'any' && c.price !== Number(prefs.price)) return false;
  if(prefs.cuisines.length && !prefs.cuisines.some(g => c.groups.includes(g))) return false; // 沒有分類資料的店會被排除
  return true;
}
function filterGroup(title, options, isOn, onPick){
  const wrap = document.createElement('div');
  const label = document.createElement('div'); label.className = 'pref-label'; label.textContent = title;
  const chips = document.createElement('div'); chips.className = 'chips';

    const chip = document.createElement('button');

    chip.textContent = text;
    chip.setAttribute('aria-pressed', String(isOn(value)));
    chip.addEventListener('click', () => { onPick(value); store.set('todayeat_prefs', prefs); renderMore(); renderPrefs(); });
    chips.appendChild(chip);
  });
  wrap.append(label, chips);
  return wrap;
}

  const body = $('more-body');
  body.textContent = '';
  body.appendChild(filterGroup(t('fSpicy'), [['any', t('fAny')], ['yes', t('fSpicyYes')], ['no', t('fSpicyNo')]],
    v => prefs.spicy === v, v => { prefs.spicy = v; }));
  body.appendChild(filterGroup(t('fPrice'), [['any', t('fAny')], ['1', t('fP1')], ['2', t('fP2')], ['3', t('fP3')]],
    v => String(prefs.price) === v, v => { prefs.price = v; }));
  body.appendChild(filterGroup(t('fCuisine'), [['any', t('fAny')]].concat(Object.keys(CUISINE_GROUPS).map(g => [g, t('cg_' + g)])),
    v => v === 'any' ? !prefs.cuisines.length : prefs.cuisines.includes(v),
    v => {
      if(v === 'any') prefs.cuisines = [];
      else prefs.cuisines = prefs.cuisines.includes(v) ? prefs.cuisines.filter(x => x !== v) : prefs.cuisines.concat(v);
    }));
}
$('btn-more').addEventListener('click', () => { renderMore(); $('more-modal').hidden = false; });
$('btn-more-done').addEventListener('click', closeModals);
$('btn-more-clear').addEventListener('click', () => {
  prefs.spicy = 'any'; prefs.price = 'any'; prefs.cuisines = [];
  store.set('todayeat_prefs', prefs);
  renderMore(); renderPrefs();
});

/* ============ 取得餐廳（OpenStreetMap Overpass，不需要 API key） ============ */
async function fetchPlaces(loc, radius, signal){
  const q = `[out:json][timeout:15];nwr["amenity"~"^(restaurant|fast_food|food_court)$"]["name"]`
          + `(around:${radius},${loc.lat},${loc.lng});out center tags;`;
  const ctrls = OVERPASS_ENDPOINTS.map(() => new AbortController());
  const abortAll = () => ctrls.forEach(c => c.abort());
  signal.addEventListener('abort', abortAll);
  const timer = setTimeout(abortAll, FETCH_TIMEOUT_MS);
  try{
    const json = await Promise.any(OVERPASS_ENDPOINTS.map(async (url, i) => {
      const res = await fetch(url, {method:'POST', body:new URLSearchParams({data:q}), signal:ctrls[i].signal});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if(!Array.isArray(j.elements) || j.remark) throw new Error('incomplete response'); // remark = 伺服器中途出錯
      return j;
    }));
    const now = new Date();
    return json.elements.map(el => toPlace(el, loc, now)).filter(Boolean);
  }finally{
    clearTimeout(timer);
    abortAll(); // 中止其餘還沒回應的
    signal.removeEventListener('abort', abortAll);
  }
}

/* 餐廳清單存在本機：同一個地方（例如公司）第二次打開不用再等網路 */
const CACHE_KEY = 'todayeat_places_v3';
function cacheFind(loc, radius, anyAge){
  return store.get(CACHE_KEY, []).find(c =>
    c.r >= radius &&
    (anyAge || Date.now() - c.ts < PLACES_TTL_MS) &&
    haversineM(loc.lat, loc.lng, c.lat, c.lng) <= CACHE_REUSE_M) || null;
}
function cacheSave(loc, radius, places){
  const rest = store.get(CACHE_KEY, []).filter(c =>
    haversineM(loc.lat, loc.lng, c.lat, c.lng) > CACHE_REUSE_M || c.r > radius);
  rest.unshift({lat:loc.lat, lng:loc.lng, r:radius, ts:Date.now(), places});
  store.set(CACHE_KEY, rest.slice(0, 4));
}
function fromCache(c, loc, radius){
  const now = new Date(); // 距離和營業狀態依現在的時間重新計算
  return c.places.map(p => Object.assign({}, p, {
    distanceM: haversineM(loc.lat, loc.lng, p.lat, p.lng),
    open: isOpenAt(p.hours, now)
  })).filter(p => p.distanceM <= radius);
}
async function getPlaces(loc, radius, signal){
  const hit = cacheFind(loc, radius, false);
  if(hit) return fromCache(hit, loc, radius);
  try{
    const places = await fetchPlaces(loc, radius, signal);
    cacheSave(loc, radius, places);
    return places;
  }catch(e){
    const stale = signal.aborted ? null : cacheFind(loc, radius, true); // 網路不通就先用舊清單
    if(stale) return fromCache(stale, loc, radius);
    throw e;
  }
}

/* ============ 主流程：按一下 → 定位 → 找餐廳 → 自動轉 ============ */
async function go(){
  clearError();
  cancelRun();
  const my = run;
  runCtrl = new AbortController();
  const signal = runCtrl.signal;
  showStep('loading');
  let loc = activePlace() || getCachedLoc();
  if(!loc){
    setLoading(t('locating'), t('locatingSub'));
    try{ loc = await locate(); }
    catch(key){ if(my === run) openPlacePicker(key, true); return; } // 定位不行就改用選的
    if(my !== run) return; // 中途按了取消
  }
  setLoading(t('searching'), t('searchingSub'));
  startLoadingClock();
  try{
    // 先看選定的距離；完全沒有可選的才逐步放遠
    const want = walkRadius(prefs.min);
    for(const d of [want, ...FETCH_BUCKETS.filter(b => b > want)]){
      const places = await getPlaces(loc, FETCH_BUCKETS.find(b => b >= d), signal);
      if(my !== run) return;
      pool = places.filter(p => p.distanceM <= d); poolRadius = d;
      if(eligible(d, false, false).length) break;
    }
  }catch(e){
    if(my === run) showError(t('serverDown'));
    return;
  }
  if(!pool.length) return showError(t('noData', fmtDist(poolRadius)));
  startWheel();
}
function startWheel(){
  rejected.clear();
  if(!buildWheel()) return showError(t(activeFilterCount() ? 'noFilterMatch' : prefs.veg ? 'noVeg' : 'noOpen'));
  showWheelAndSpin();
}
function showWheelAndSpin(){
  showStep('wheel');
  const token = spinToken;
  setTimeout(() => { if(token === spinToken) spin(); }, 450); // 等畫面出現後再轉
}
$('btn-go').addEventListener('click', go);

/* ============ 決定哪幾間上輪盤 ============ */
function recentIds(){
  const cutoff = Date.now() - AVOID_REPEAT_DAYS*86400000;
  return new Set(store.get('todayeat_history', []).filter(h => h.ts > cutoff).map(h => h.id));
}
function eligible(dist, skipRejected, skipRecent){
  const recent = skipRecent ? recentIds() : new Set();
  return pool.filter(p =>
    p.distanceM <= dist &&
    p.open !== false &&                 // 確定已打烊才剔除；不確定的照樣列入，結果頁會提醒
    (!prefs.veg || p.veg) &&
    matchesFilters(p) &&
    !(skipRejected && rejected.has(p.id)) &&
    !recent.has(p.id));
}
function buildWheel(){
  // 逐步放寬：先套用全部條件 → 不管「這次不想吃」→ 連「這兩天吃過」也不管
  for(const [skipRejected, skipRecent] of [[true,true],[false,true],[false,false]]){
    const list = eligible(poolRadius, skipRejected, skipRecent);
    if(!list.length) continue;
    if(!skipRejected) rejected.clear();
    wheel = shuffle(list).slice(0, WHEEL_MAX);
    let note = list.length > wheel.length ? t('noteSome', list.length, wheel.length) : t('noteAll', list.length);
    if(poolRadius > walkRadius(prefs.min)) note += t('noteWiden', fmtDist(walkRadius(prefs.min)), fmtDist(poolRadius));
    $('wheel-note').textContent = note;
    drawWheel();
    return true;
  }
  return false;
}

/* ============ 畫輪盤 ============ */
function drawWheel(){
  const canvas = $('wheel-canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 280*dpr; canvas.height = 280*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,280,280);
  const n = wheel.length, seg = 2*Math.PI/n, c = 140;
  wheel.forEach((p, i) => {
    const start = -Math.PI/2 + i*seg;
    ctx.beginPath();
    ctx.moveTo(c,c);
    ctx.arc(c,c,c,start,start+seg);
    ctx.closePath();
    // 最後一格和第一格同色就換一個顏色
    let color = PALETTE[i % PALETTE.length];
    if(n > 1 && i === n-1 && color === PALETTE[0]) color = PALETTE[3];
    ctx.fillStyle = color;
    ctx.fill();
    if(n > 1){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }

    ctx.save();
    ctx.translate(c,c);
    ctx.rotate(start + seg/2);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = '700 13px "Noto Sans TC", sans-serif';
    // 依實際寬度截短，中英文都適用
    let label = placeName(p);
    if(ctx.measureText(label).width > 92){
      const chars = Array.from(label);
      while(chars.length > 1 && ctx.measureText(chars.join('') + '…').width > 92) chars.pop();
      label = chars.join('').trim() + '…';
    }
    ctx.fillText(label, c-14, 0);
    ctx.restore();
  });
  const dial = $('wheel-dial');
  rotation = 0;
  dial.style.transition = 'none';
  dial.style.transform = 'rotate(0deg)';
  void dial.offsetWidth; // 強制重排，讓下一次轉動有動畫
}

/* ============ 轉 ============ */
function spin(){
  if(spinning || !wheel.length) return;
  spinning = true;
  const token = ++spinToken;
  $('btn-spin').disabled = true;
  const n = wheel.length, seg = 360/n;
  const winner = Math.floor(Math.random()*n);          // 先公平抽出，再轉到那一格
  const theta = winner*seg + seg*(0.15 + Math.random()*0.7);
  const base = Math.ceil(rotation/360)*360;
  rotation = base + (5 + Math.floor(Math.random()*3))*360 + (360 - theta);

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dial = $('wheel-dial');
  dial.style.transition = reduce ? 'none' : 'transform 4s cubic-bezier(0.15,0.65,0.1,1)';
  dial.style.transform = `rotate(${rotation}deg)`;

  let done = false;
  const finish = () => {
    if(done || token !== spinToken) return; // 已經回首頁就不要再跳結果
    done = true;
    spinning = false;
    $('btn-spin').disabled = false;
    showResult(wheel[winner]);
  };
  if(reduce){ setTimeout(finish, 400); }
  else{
    dial.addEventListener('transitionend', finish, {once:true});
    setTimeout(finish, 4700); // 分頁在背景時 transitionend 不一定會觸發，保底
  }
}
$('btn-spin').addEventListener('click', spin);

/* ============ 結果 ============ */
function showResult(p){
  current = p;
  $('result-name').textContent = placeName(p);

  const walkMin = Math.max(1, Math.round(p.distanceM / WALK_M_PER_MIN));
  const place = activePlace();
  const dist = place ? t('fromPlace', shortName(place.name), fmtDist(p.distanceM)) : fmtDist(p.distanceM);
  $('result-meta').textContent = [cuisineText(p), dist, t('walk', walkMin)].filter(Boolean).join(t('sep'));

  $('result-status').textContent = p.open === true ? t('openNow') : t('openUnknown');
  $('result-detail').textContent = [p.address, p.hours ? t('hours', p.hours) : ''].filter(Boolean).join('\n');
  $('result-detail').style.whiteSpace = 'pre-line';

  const mapBox = $('result-map');
  mapBox.textContent = '';
  const d = 0.003;
  const frame = document.createElement('iframe');
  frame.loading = 'lazy';
  frame.title = t('mapTitle');
  frame.src = 'https://www.openstreetmap.org/export/embed.html?bbox='
    + [p.lng-d, p.lat-d, p.lng+d, p.lat+d].join('%2C')
    + '&layer=mapnik&marker=' + p.lat + '%2C' + p.lng;
  mapBox.appendChild(frame);

  $('btn-navigate').href = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking`;
  $('link-reviews').href = `https://www.google.com/maps/search/${encodeURIComponent(p.name)}/@${p.lat},${p.lng},18z`;
  const phone = $('btn-phone');
  const shown = (p.phone || '').split(';')[0].trim();
  const tel = shown.replace(/[^\d+]/g,'');
  phone.hidden = !tel;
  if(tel){
    phone.href = 'tel:' + tel;
    phone.textContent = t('call', shown);
  }
  $('toast').textContent = '';
  showStep('result');
}

$('btn-navigate').addEventListener('click', () => {
  if(!current) return;
  addHistory(current);
  $('toast').textContent = t('saved', AVOID_REPEAT_DAYS);
});
$('btn-reject').addEventListener('click', () => {
  if(current) rejected.add(current.id);
  if(!buildWheel()) return showError(t('noMore'));
  showWheelAndSpin();
});

/* ============ 紀錄 ============ */
function addHistory(p){
  const list = store.get('todayeat_history', []);
  if(list[0] && list[0].id === p.id && Date.now() - list[0].ts < 3*3600000) return; // 連按不重複記錄
  list.unshift({id:p.id, name:p.name, nameEn:p.nameEn || '', lat:p.lat, lng:p.lng, ts:Date.now()});
  store.set('todayeat_history', list.slice(0,60));
}
function renderHistory(){
  const wrap = $('history-list');
  wrap.textContent = '';
  const list = store.get('todayeat_history', []);
  $('btn-history-clear').hidden = !list.length;
  if(!list.length){
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = t('historyEmpty');
    wrap.appendChild(empty);
    return;
  }
  list.forEach(h => {
    const item = document.createElement('div'); item.className = 'history-item';
    const left = document.createElement('div');
    const name = document.createElement('div'); name.className = 'h-name'; name.textContent = placeName(h);
    const time = document.createElement('div'); time.className = 'h-time';
    time.textContent = new Date(h.ts).toLocaleString(t('locale'), {month:'numeric', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit'});
    left.append(name, time);
    item.appendChild(left);
    if(h.lat != null && h.lng != null){
      const a = document.createElement('a');
      a.href = `https://www.google.com/maps/search/${encodeURIComponent(h.name)}/@${h.lat},${h.lng},18z`;
      a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('map');
      item.appendChild(a);
    }
    wrap.appendChild(item);
  });
}
function openHistory(fromResult){
  renderHistory();
  $('btn-history-back').hidden = !fromResult;
  showStep('history');
}
$('btn-history-start').addEventListener('click', () => openHistory(false));
$('btn-history-result').addEventListener('click', () => openHistory(true));
$('btn-history-back').addEventListener('click', () => showStep('result'));
$('btn-history-clear').addEventListener('click', () => {
  if(confirm(t('clearConfirm'))){ store.set('todayeat_history', []); renderHistory(); }
});

buildWalkIcons();
applyLang();
showStep('start');
</script>
